[package]
name = "sentinel-av"
version = "1.0.0"
edition = "2021"
authors = ["Sentinel Security Team"]
description = "Enterprise-grade antivirus engine for Windows"
license = "MIT"

[dependencies]
# Windows API
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_SystemServices",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_NetworkManagement_IpHelper",
] }

# Async runtime
tokio = { version = "1.41", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Cryptography & Hashing
sha2 = "0.10"
md5 = "0.7"
blake3 = "1.5"
hex = "0.4"

# File monitoring
notify = "7.0"

# HTTP & API
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI
clap = { version = "4.5", features = ["derive", "cargo"] }
colored = "2.1"
indicatif = "0.17"

# PE parsing
goblin = "0.9"

# Regular expressions
regex = "1.11"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Utils
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
walkdir = "2.5"
rayon = "1.10"

# YARA-like pattern matching
yara = { version = "0.29", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true

[[bin]]
name = "sentinel-av"
path = "src/main.rs"

[lib]
name = "sentinel_av"
path = "src/lib.rs"
